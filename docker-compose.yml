services:
  knowledge-db:
    # PostgreSQL 16 + pgvector。与应用栈放在同一个 compose 里，
    # 一条 docker compose down 就能全部停掉，不会留下网络占用。
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: knowledge
    ports:
      # 宿主机 15433，避开本机 5432 与 Langfuse 的 15432。
      # 绑定 127.0.0.1：本机 localhost 会走 IPv6，映射连不上。
      - "127.0.0.1:15433:5432"
    volumes:
      - knowledge_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d knowledge"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      knowledge-db:
        condition: service_healthy
    environment:
      CONSULTATION_DB_PATH: /data/consultations.sqlite
      # Docker 专用开关：USE_MODEL_DOCKER=1 让容器走真实模型，不影响本地 pytest。
      USE_MODEL: ${USE_MODEL_DOCKER:-0}
      # 不填时按 USE_MODEL 自动取默认：mock 8、模型 64。
      GRAPH_MAX_WORKERS: ${GRAPH_MAX_WORKERS:-}
      AUTH_MODE: ${AUTH_MODE:-off}
      API_KEYS: ${API_KEYS:-}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-1}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}
      RATE_BURST: ${RATE_BURST:-10}
      SESSION_RATE_LIMIT_PER_MINUTE: ${SESSION_RATE_LIMIT_PER_MINUTE:-30}
      SESSION_BURST: ${SESSION_BURST:-5}
      GLOBAL_RATE_LIMIT_PER_MINUTE: ${GLOBAL_RATE_LIMIT_PER_MINUTE:-600}
      GLOBAL_BURST: ${GLOBAL_BURST:-100}
      MAX_BODY_BYTES: ${MAX_BODY_BYTES:-32768}
      MAX_MESSAGE_CHARS: ${MAX_MESSAGE_CHARS:-2000}
      MAX_STREAMS_PER_CLIENT: ${MAX_STREAMS_PER_CLIENT:-5}
      SCORE_LOG_PATH: ${SCORE_LOG_PATH:-/data/scores.jsonl}
      # 外部 MCP 工具：默认关闭；在 .env 里设 MCP_ENABLED=1 并配置 MCP_SERVERS。
      MCP_ENABLED: ${MCP_ENABLED:-0}
      MCP_SERVERS: ${MCP_SERVERS:-}
      # Langfuse：容器内访问宿主机用 host.docker.internal；Docker 专用变量避免
      # 与本地 uvicorn 的 LANGFUSE_HOST=127.0.0.1 冲突。
      TRACE_SINK: ${TRACE_SINK_DOCKER:-none}
      TRACE_PATH: ${TRACE_PATH_DOCKER:-/data/traces.jsonl}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST_DOCKER:-http://host.docker.internal:3000}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_MODEL: ${DASHSCOPE_MODEL:-qwen-plus}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      # 宿主机代理用 fake-ip 时，容器会解析到 198.18.x.x 并握手失败。
      # 在 .env 里配置 HTTP(S)_PROXY_DOCKER 后，模型调用走宿主机代理。
      HTTP_PROXY: ${HTTP_PROXY_DOCKER:-}
      HTTPS_PROXY: ${HTTPS_PROXY_DOCKER:-}
      NO_PROXY: ${NO_PROXY_DOCKER:-localhost,127.0.0.1,knowledge-db,host.docker.internal}
      # 容器内按服务名解析；本机直接跑 uvicorn 时用默认的 127.0.0.1:15433。
      KNOWLEDGE_DB_URL: postgresql://postgres:postgres@knowledge-db:5432/knowledge
    volumes:
      - consultations_data:/data
    extra_hosts:
      # Linux 上让 host.docker.internal 指向宿主机；macOS/Windows 自带。
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    restart: unless-stopped

volumes:
  consultations_data:
  knowledge_pg_data:
