<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700" font-family="'DM Sans','Noto Sans SC',-apple-system,BlinkMacSystemFont,sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a5f58"/>
    </marker>
    <marker id="arrow-soft" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#7d9189"/>
    </marker>
  </defs>

  <rect width="1120" height="700" fill="#fbfdfb"/>
  <rect x="1" y="1" width="1118" height="698" rx="18" fill="none" stroke="#e2ebe5"/>

  <text x="48" y="42" font-size="19" font-weight="700" fill="#18332f">Langfuse 完整工作流：从一条请求到一次改进</text>
  <text x="48" y="68" font-size="12.5" fill="#6b7f78">trace 记录“发生了什么”，score 记录“好不好”，dataset 让改进可重复。</text>

  <!-- 采集链路 -->
  <text x="48" y="104" font-size="13" font-weight="700" fill="#2f6f57">采集链路（一次请求只做一次配置）</text>

  <rect x="40" y="118" width="160" height="92" rx="11" fill="#eef2ef" stroke="#dbe4de"/>
  <text x="120" y="148" font-size="13.5" font-weight="700" fill="#3d4f47" text-anchor="middle">① 用户请求</text>
  <text x="120" y="171" font-size="11.5" fill="#6b7f78" text-anchor="middle">session + turn</text>
  <text x="120" y="191" font-size="11" fill="#93a79c" text-anchor="middle">每个会话一个 session_id</text>

  <rect x="220" y="118" width="160" height="92" rx="11" fill="#e7f1eb" stroke="#cfe2d7"/>
  <text x="300" y="148" font-size="13.5" font-weight="700" fill="#2f6f57" text-anchor="middle">② Agent 进程</text>
  <text x="300" y="171" font-size="11.5" fill="#5c7369" text-anchor="middle">生成 trace 树</text>
  <text x="300" y="191" font-size="11" fill="#93a79c" text-anchor="middle">节点 / LLM / 工具各自一个 span</text>

  <rect x="400" y="118" width="160" height="92" rx="11" fill="#e9f0f6" stroke="#d2e0ea"/>
  <text x="480" y="148" font-size="13.5" font-weight="700" fill="#3f657d" text-anchor="middle">③ OTel SDK</text>
  <text x="480" y="171" font-size="11.5" fill="#5c727f" text-anchor="middle">BatchSpanProcessor</text>
  <text x="480" y="191" font-size="11" fill="#93a79c" text-anchor="middle">后台攒批，约每 5 秒发送</text>

  <rect x="580" y="118" width="160" height="92" rx="11" fill="#f5ece4" stroke="#e8d8c9"/>
  <text x="660" y="148" font-size="13.5" font-weight="700" fill="#8a5a3b" text-anchor="middle">④ OTLP/HTTP</text>
  <text x="660" y="171" font-size="11.5" fill="#7a6353" text-anchor="middle">otel/v1/traces</text>
  <text x="660" y="191" font-size="11" fill="#9a8575" text-anchor="middle">标准协议，换后端不用改埋点</text>

  <rect x="760" y="118" width="160" height="92" rx="11" fill="#f3ecf0" stroke="#e3d3dc"/>
  <text x="840" y="148" font-size="13.5" font-weight="700" fill="#7a4a63" text-anchor="middle">⑤ Langfuse</text>
  <text x="840" y="171" font-size="11.5" fill="#7d6572" text-anchor="middle">web + worker ingestion</text>
  <text x="840" y="191" font-size="11" fill="#9a8592" text-anchor="middle">校验、写入、建索引</text>

  <rect x="940" y="118" width="160" height="92" rx="11" fill="#e6efec" stroke="#cfe1da"/>
  <text x="1020" y="148" font-size="13.5" font-weight="700" fill="#2f5f55" text-anchor="middle">⑥ 存储</text>
  <text x="1020" y="171" font-size="11.5" fill="#5c7369" text-anchor="middle">PG · CH · Redis · MinIO</text>
  <text x="1020" y="191" font-size="11" fill="#93a79c" text-anchor="middle">元数据 / 事件 / 队列 / 大对象</text>

  <!-- 箭头 -->
  <line x1="200" y1="164" x2="208" y2="164" stroke="#4a5f58" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="380" y1="164" x2="388" y2="164" stroke="#4a5f58" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="560" y1="164" x2="568" y2="164" stroke="#4a5f58" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="740" y1="164" x2="748" y2="164" stroke="#4a5f58" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="920" y1="164" x2="928" y2="164" stroke="#4a5f58" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- UI -->
  <rect x="580" y="238" width="520" height="62" rx="11" fill="#f4f8f5" stroke="#dbe8df"/>
  <text x="840" y="262" font-size="13.5" font-weight="700" fill="#2f6f57" text-anchor="middle">Langfuse UI：Tracing / Sessions / Scores / Datasets / Experiments</text>
  <text x="840" y="284" font-size="11.5" fill="#7d9189" text-anchor="middle">点开一条 trace，看时间线、父子关系、token、成本、错误</text>
  <line x1="1020" y1="210" x2="1020" y2="230" stroke="#4a5f58" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 使用闭环 -->
  <text x="48" y="340" font-size="13" font-weight="700" fill="#2f6f57">使用闭环（每周都会重复）</text>

  <rect x="48" y="360" width="190" height="86" rx="11" fill="#e7f1eb" stroke="#cfe2d7"/>
  <text x="143" y="390" font-size="13" font-weight="700" fill="#2f6f57" text-anchor="middle">① 看 Trace</text>
  <text x="143" y="413" font-size="11.2" fill="#5c7369" text-anchor="middle">哪一步慢、哪一步错</text>
  <text x="143" y="432" font-size="11.2" fill="#93a79c" text-anchor="middle">按 session / 名称 / 耗时筛选</text>

  <rect x="256" y="360" width="190" height="86" rx="11" fill="#e9f0f6" stroke="#d2e0ea"/>
  <text x="351" y="390" font-size="13" font-weight="700" fill="#3f657d" text-anchor="middle">② 打分</text>
  <text x="351" y="413" font-size="11.2" fill="#5c727f" text-anchor="middle">用户 feedback / 评委</text>
  <text x="351" y="432" font-size="11.2" fill="#93a79c" text-anchor="middle">score 挂在 trace 上</text>

  <rect x="464" y="360" width="190" height="86" rx="11" fill="#f5ece4" stroke="#e8d8c9"/>
  <text x="559" y="390" font-size="13" font-weight="700" fill="#8a5a3b" text-anchor="middle">③ 收进 Dataset</text>
  <text x="559" y="413" font-size="11.2" fill="#7a6353" text-anchor="middle">把典型 case 固定下来</text>
  <text x="559" y="432" font-size="11.2" fill="#9a8575" text-anchor="middle">输入 + 期望 + 现有 trace</text>

  <rect x="672" y="360" width="190" height="86" rx="11" fill="#f3ecf0" stroke="#e3d3dc"/>
  <text x="767" y="390" font-size="13" font-weight="700" fill="#7a4a63" text-anchor="middle">④ 跑 Experiment</text>
  <text x="767" y="413" font-size="11.2" fill="#7d6572" text-anchor="middle">同一批 case 前后对比</text>
  <text x="767" y="432" font-size="11.2" fill="#9a8592" text-anchor="middle">看指标，不靠感觉</text>

  <rect x="880" y="360" width="190" height="86" rx="11" fill="#e6efec" stroke="#cfe1da"/>
  <text x="975" y="390" font-size="13" font-weight="700" fill="#2f5f55" text-anchor="middle">⑤ 改 Prompt / 模型</text>
  <text x="975" y="413" font-size="11.2" fill="#5c7369" text-anchor="middle">一次只改一个变量</text>
  <text x="975" y="432" font-size="11.2" fill="#93a79c" text-anchor="middle">产生新 trace，回到 ①</text>

  <!-- 闭环箭头 -->
  <line x1="238" y1="403" x2="248" y2="403" stroke="#4a5f58" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="446" y1="403" x2="456" y2="403" stroke="#4a5f58" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="654" y1="403" x2="664" y2="403" stroke="#4a5f58" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="862" y1="403" x2="872" y2="403" stroke="#4a5f58" stroke-width="1.5" marker-end="url(#arrow)"/>

  <path d="M975 446 v52 H143 v-44" fill="none" stroke="#7d9189" stroke-width="1.4" stroke-dasharray="5 5" marker-end="url(#arrow-soft)"/>
  <text x="560" y="516" font-size="11.5" fill="#7d9189" text-anchor="middle">闭环：每次改动都留下新的 trace 和前后对比</text>

  <!-- 底部三句话 -->
  <rect x="48" y="548" width="1022" height="108" rx="13" fill="#fff8ee" stroke="#f0dfc8"/>
  <text x="72" y="576" font-size="13" font-weight="700" fill="#a5672f">三个容易混淆的概念</text>
  <text x="72" y="602" font-size="12" fill="#8a6a4a">Trace：一次请求的完整事实（父子 span + 时间 + 属性）。</text>
  <text x="72" y="624" font-size="12" fill="#8a6a4a">Score：对某个 trace 的判断（好评 / 差评 / 评委分），不是事实本身。</text>
  <text x="72" y="646" font-size="12" fill="#8a6a4a">Dataset + Experiment：把“判断”变成可重复的考题，用来证明改动真的变好了。</text>

  <text x="560" y="684" font-size="11.5" fill="#93a79c" text-anchor="middle">本地实操：TRACE_SINK=langfuse，LANGFUSE_HOST 用 127.0.0.1，UI 里按 session_id 找会话。</text>
</svg>
