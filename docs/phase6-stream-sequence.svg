<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="820" viewBox="0 0 1120 820" font-family="'DM Sans','Noto Sans SC',-apple-system,BlinkMacSystemFont,sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a5f58"/>
    </marker>
    <marker id="arrow-soft" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#7d9189"/>
    </marker>
  </defs>

  <rect width="1120" height="820" fill="#fbfdfb"/>
  <rect x="1" y="1" width="1118" height="818" rx="18" fill="none" stroke="#e2ebe5"/>

  <text x="56" y="42" font-size="19" font-weight="700" fill="#18332f">Phase 6 · 流式一轮的时序：三条独立的执行线</text>
  <text x="56" y="68" font-size="12.5" fill="#6b7f78">时间从上往下走。实线箭头是消息，竖直虚线表示这条线还活着。</text>
  <text x="1064" y="68" font-size="12" fill="#7d9189" text-anchor="end">──▶ 消息　　┄┄ 存活</text>

  <!-- 三条执行线的头部 -->
  <rect x="90" y="90" width="180" height="52" rx="11" fill="#e7f1eb" stroke="#cfe2d7"/>
  <text x="180" y="111" font-size="14" font-weight="700" fill="#2f6f57" text-anchor="middle">前台 · _event_stream</text>
  <text x="180" y="130" font-size="12" fill="#5c7369" text-anchor="middle">把事件发给客户端</text>

  <rect x="470" y="90" width="180" height="52" rx="11" fill="#e9f0f6" stroke="#d2e0ea"/>
  <text x="560" y="111" font-size="14" font-weight="700" fill="#3f657d" text-anchor="middle">监工 · _stream_turn</text>
  <text x="560" y="130" font-size="12" fill="#5c727f" text-anchor="middle">等待工作线程</text>

  <rect x="850" y="90" width="180" height="52" rx="11" fill="#f5ecE4" stroke="#e8d8c9"/>
  <text x="940" y="111" font-size="14" font-weight="700" fill="#8a5a3b" text-anchor="middle">工作线程 · work()</text>
  <text x="940" y="130" font-size="12" fill="#7a6353" text-anchor="middle">跑图并产出事件</text>

  <!-- 生命线 -->
  <line x1="180" y1="142" x2="180" y2="730" stroke="#c9d5cd" stroke-width="1.4" stroke-dasharray="5 6"/>
  <line x1="560" y1="142" x2="560" y2="730" stroke="#c9d5cd" stroke-width="1.4" stroke-dasharray="5 6"/>
  <line x1="940" y1="142" x2="940" y2="730" stroke="#c9d5cd" stroke-width="1.4" stroke-dasharray="5 6"/>

  <!-- ① create_task -->
  <circle cx="52" cy="182" r="12" fill="#eef4f0" stroke="#d5e2da"/>
  <text x="52" y="186" font-size="11.5" fill="#4a5f58" text-anchor="middle">1</text>
  <line x1="180" y1="182" x2="548" y2="182" stroke="#4a5f58" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="364" y="173" font-size="12.5" fill="#18332f" text-anchor="middle">create_task(_stream_turn)</text>
  <text x="572" y="204" font-size="11.5" fill="#7d9189">进入待运行队列（还没开始跑）</text>

  <!-- ② 前台挂起 -->
  <rect x="82" y="222" width="196" height="34" rx="8" fill="#f1f6f2" stroke="#dbe6df"/>
  <text x="180" y="244" font-size="12.5" fill="#3d5c50" text-anchor="middle">await queue.get()　⏸ 挂起</text>

  <!-- ③ await to_thread -->
  <circle cx="52" cy="296" r="12" fill="#eef4f0" stroke="#d5e2da"/>
  <text x="52" y="300" font-size="11.5" fill="#4a5f58" text-anchor="middle">2</text>
  <line x1="560" y1="296" x2="928" y2="296" stroke="#4a5f58" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="744" y="287" font-size="12.5" fill="#18332f" text-anchor="middle">await asyncio.to_thread(work)</text>
  <text x="572" y="320" font-size="11.5" fill="#7d9189">挂起，等线程结束</text>

  <!-- ④ start_trace -->
  <rect x="952" y="330" width="150" height="32" rx="8" fill="#f8f1ea" stroke="#ecdfd2"/>
  <text x="1027" y="351" font-size="12" fill="#7a5a42" text-anchor="middle">start_trace(…)</text>

  <!-- ⑤ push meta -->
  <circle cx="52" cy="400" r="12" fill="#eef4f0" stroke="#d5e2da"/>
  <text x="52" y="404" font-size="11.5" fill="#4a5f58" text-anchor="middle">3</text>
  <line x1="940" y1="400" x2="192" y2="400" stroke="#4a5f58" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="566" y="391" font-size="12.5" fill="#18332f" text-anchor="middle">push("meta")</text>
  <text x="566" y="418" font-size="11" fill="#7d9189" text-anchor="middle">经 queue 线程安全投递</text>

  <!-- ⑥ 前台 yield meta -->
  <rect x="82" y="438" width="196" height="32" rx="8" fill="#f1f6f2" stroke="#dbe6df"/>
  <text x="180" y="459" font-size="12.5" fill="#3d5c50" text-anchor="middle">yield meta → 客户端</text>

  <!-- ⑦ 工作线程自循环 -->
  <path d="M940,492 h118 v26 h-118" fill="none" stroke="#7d9189" stroke-width="1.4" marker-end="url(#arrow-soft)"/>
  <text x="999" y="484" font-size="11.5" fill="#7a6353" text-anchor="middle">graph.stream(debug)</text>
  <text x="999" y="512" font-size="11" fill="#9a8575" text-anchor="middle">逐节点推进（同步阻塞在这里）</text>

  <!-- ⑧ push node -->
  <circle cx="52" cy="564" r="12" fill="#eef4f0" stroke="#d5e2da"/>
  <text x="52" y="568" font-size="11.5" fill="#4a5f58" text-anchor="middle">4</text>
  <line x1="940" y1="564" x2="192" y2="564" stroke="#4a5f58" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="566" y="555" font-size="12.5" fill="#18332f" text-anchor="middle">push("node")　× N</text>

  <rect x="82" y="584" width="196" height="32" rx="8" fill="#f1f6f2" stroke="#dbe6df"/>
  <text x="180" y="605" font-size="12.5" fill="#3d5c50" text-anchor="middle">yield node → 客户端</text>

  <!-- ⑨ result / done -->
  <circle cx="52" cy="652" r="12" fill="#eef4f0" stroke="#d5e2da"/>
  <text x="52" y="656" font-size="11.5" fill="#4a5f58" text-anchor="middle">5</text>
  <line x1="940" y1="652" x2="192" y2="652" stroke="#4a5f58" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="566" y="643" font-size="12.5" fill="#18332f" text-anchor="middle">push("result") → push("__done__")</text>

  <rect x="82" y="672" width="196" height="32" rx="8" fill="#f1f6f2" stroke="#dbe6df"/>
  <text x="180" y="693" font-size="12.5" fill="#3d5c50" text-anchor="middle">break → 关闭响应</text>

  <!-- ⑩ work 返回 -->
  <circle cx="52" cy="716" r="12" fill="#eef4f0" stroke="#d5e2da"/>
  <text x="52" y="720" font-size="11.5" fill="#4a5f58" text-anchor="middle">6</text>
  <line x1="940" y1="716" x2="572" y2="716" stroke="#4a5f58" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="756" y="707" font-size="12.5" fill="#18332f" text-anchor="middle">work() 返回（线程结束）</text>

  <!-- 底部断线说明 -->
  <rect x="56" y="756" width="1008" height="44" rx="10" fill="#fdf5f2" stroke="#f0d8d2"/>
  <text x="76" y="783" font-size="12.5" fill="#8a4b40">断线时：前台这条线结束，不再 yield；监工与医生继续跑，直到 work() 返回，checkpoint 与审计照常落库。</text>
</svg>
