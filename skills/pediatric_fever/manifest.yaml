name: pediatric_fever
title: 儿童发热问诊
description: 儿童与婴幼儿发热的追问、精神状态评估与就医方向整理
priority: 1
when_to_use:
  - 孩子
  - 宝宝
  - 小孩
  - 儿童
  - 婴儿
  - 幼儿
  - 新生儿
  - 月龄
  - 岁半
  - 一岁
  - 两岁
  - 三岁
  - 四岁
  - 五岁
  - 六岁
  - 七岁
  - 八岁
  - 九岁
  - 十岁
required_fields:
  - 主要症状
  - 持续时间
  - 年龄
  - 测量值
  - 伴随表现
  - 精神状态
optional_fields:
  - 已知背景
  - 加重缓解因素
followup_priority:
  - 年龄
  - 测量值
  - 持续时间
  - 主要症状
  - 伴随表现
  - 精神状态
question_templates:
  年龄: 孩子多大了，是几个月还是几岁？
  测量值: 体温是多少，什么时候量的？
  持续时间: 发热持续多久了？
  主要症状: 除了发热，还有其他不舒服吗？
  伴随表现: 有没有咳嗽、皮疹、呕吐或腹泻？
  精神状态: 孩子现在精神状态怎么样，能不能正常玩和喝水？
reply_options:
  年龄: [六个月, 一岁, 三岁]
  测量值: [三十八度, 三十八度五, 三十九度]
  持续时间: [一天内, 两三天, 一周以上]
  主要症状: [发热, 咳嗽, 皮疹]
  伴随表现: [没有其他不适, 有咳嗽, 有呕吐]
  精神状态: [精神好, 精神差, 嗜睡]
tools:
  - department_route
  - red_flag_lookup
  - guideline_retrieve
output_template: |
  建议就诊方向：{department}
  就诊时带上：体温记录、发热天数、用药清单。
