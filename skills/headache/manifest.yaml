name: headache
title: 头痛问诊
description: 头痛、头晕、偏头痛等头部不适的追问与就诊方向整理
priority: 10
when_to_use:
  - 头痛
  - 头疼
  - 头晕
  - 脑袋
  - 偏头痛
  - 前额
  - 太阳穴
  - 后脑
required_fields:
  - 主要症状
  - 持续时间
  - 部位
  - 程度
  - 伴随表现
  - 已知背景
optional_fields:
  - 加重缓解因素
  - 时间模式
  - 测量值
followup_priority:
  - 主要症状
  - 持续时间
  - 部位
  - 伴随表现
  - 程度
  - 已知背景
question_templates:
  主要症状: 请问主要的不适是什么？
  持续时间: 请问头痛持续多久了？
  部位: 请问疼痛主要在头的哪个部位？
  伴随表现: 有没有恶心、呕吐、畏光或视物模糊？
  程度: 请问疼痛的程度如何，是轻微、明显还是严重？
  已知背景: 请问有没有既往病史或正在用药？
reply_options:
  主要症状: [头痛, 头晕, 头部不适]
  持续时间: [一天内, 两三天, 一周以上]
  部位: [前额, 太阳穴, 后脑, 整个头部]
  伴随表现: [没有其他不适, 有恶心, 有畏光]
  程度: [轻微, 明显, 严重]
  已知背景: [无病史, 有偏头痛史, 正在用药]
tools:
  - department_route
  - red_flag_lookup
  - guideline_retrieve
output_template: |
  建议就诊方向：{department}
