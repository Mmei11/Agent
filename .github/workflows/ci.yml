name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Tests and mock evals
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      USE_MODEL: "0"
      # CI 没有向量库，知识工具用确定性替身跑流程；检索质量由本地评测负责
      KNOWLEDGE_BACKEND: "stub"
      # 技能层：CI 只用规则路由，避免依赖模型 Key。
      SKILLS_ENABLED: "1"
      SKILL_ROUTER_MODE: "rule"
      MCP_ENABLED: "0"
      # 评测脚本不经 conftest，必须显式关掉鉴权与限流，避免脚本被 401/429 拦住。
      AUTH_MODE: "off"
      RATE_LIMIT_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.8.22"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Unit tests
        run: uv run python -m pytest -q

      - name: Hard assertions (dev only)
        run: uv run python -m eval.run_eval --split dev

      - name: Skill routing (rule, gate 0.9)
        run: uv run python -m eval.skill_routing --mode rule --min-accuracy 0.9

      - name: Skill eval (mock, gate 0.9)
        run: uv run python -m eval.skill_eval --min-accuracy 0.9

      - name: Source verification (structure)
        run: uv run python -m eval.source_check

      - name: Red team (dev only)
        run: uv run python -m eval.red_team --split dev

      - name: Risk probe (rules only)
        run: uv run python -m eval.risk_probe --output eval/results/risk-probe-ci.json

      - name: Adversarial layered safety
        run: uv run python -m eval.adversarial_eval --output eval/results/adversarial-ci.json

      - name: Gate self-check
        run: uv run python -m eval.self_check

      - name: Gate break check
        run: uv run python -m eval.ci_break_check

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-reports
          path: |
            eval/results/agent-eval-report.md
            eval/results/redteam/redteam-report.md
            eval/results/risk-probe-ci.json
            eval/results/adversarial-ci.json
            eval/results/skill-routing/skill-routing-report-rule.md
            eval/results/skill-eval/skill-eval-report.md
            eval/results/source-check/source-check-report.md
          if-no-files-found: ignore

  docker:
    name: Docker build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: consultation-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max