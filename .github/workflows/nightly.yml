name: Nightly model quality

on:
  schedule:
    # GitHub cron 是 UTC；19:17 UTC = 北京时间次日 03:17
    - cron: "17 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-model-quality
  cancel-in-progress: false

jobs:
  model-quality:
    name: Model evals and judge sampling
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
      DASHSCOPE_MODEL: qwen-plus
      JUDGE_MODEL: qwen-max
      MODEL_PRICE_INPUT_PER_1K: "0.0008"
      MODEL_PRICE_OUTPUT_PER_1K: "0.002"
      JUDGE_PRICE_INPUT_PER_1K: "0.0024"
      JUDGE_PRICE_OUTPUT_PER_1K: "0.0096"
      TRACE_SINK: none
      # 夜间跑真实检索：连下面 services 里的 pgvector，而不是 stub。
      KNOWLEDGE_DB_URL: postgresql://postgres:postgres@127.0.0.1:5433/knowledge
    services:
      # recall 评测必须连真库：stub 只跑流程，量不出检索质量。
      pgvector:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: knowledge
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d knowledge"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.8.22"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Require API key
        run: |
          if [ -z "$DASHSCOPE_API_KEY" ]; then
            echo "::error::缺少 DASHSCOPE_API_KEY secret；请在 Settings → Secrets and variables → Actions 添加。"
            exit 1
          fi

      - name: Build knowledge index
        run: uv run python -m backend.app.knowledge

      - name: Retrieval recall@5
        run: uv run python -m eval.recall_eval

      - name: Model-mode hard assertions (dev)
        run: uv run python -m eval.run_eval --use-model --split dev

      - name: Model-mode red team (all)
        run: uv run python -m eval.red_team --use-model --split all

      - name: Judge sampling n=5
        run: |
          uv run python -m eval.repeat --n 5 \
            --case E009,E015,E017,E018,E020 \
            --judge-cases E009,E015,E017,E018,E020 \
            --output-dir eval/results/nightly-repeat

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-reports
          path: |
            eval/results/agent-eval-report.md
            eval/results/redteam/redteam-report.md
            eval/results/nightly-repeat/repeat-report.md
          if-no-files-found: ignore