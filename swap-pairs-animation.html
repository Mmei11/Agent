<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>两两交换链表节点 · 递归动画</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background: #0f1525;
    color: #e6e9f0;
    min-height: 100vh;
    padding: 24px;
  }
  .wrap { max-width: 1080px; margin: 0 auto; }
  h1 { font-size: 20px; font-weight: 600; margin-bottom: 4px; color: #7fc7ff; }
  .sub { font-size: 13px; color: #8b93a7; margin-bottom: 20px; }

  .stage {
    background: #161d33;
    border: 1px solid #232b48;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .canvas-wrap { position: relative; }
  svg { display: block; width: 100%; height: 220px; }

  .layout { display: grid; grid-template-columns: 1fr 280px; gap: 16px; }
  @media (max-width: 760px) { .layout { grid-template-columns: 1fr; } }

  .code {
    background: #0c1120;
    border: 1px solid #232b48;
    border-radius: 10px;
    padding: 14px 16px;
    font-family: "SF Mono", "JetBrains Mono", Menlo, monospace;
    font-size: 12.5px;
    line-height: 1.9;
    white-space: pre;
    overflow-x: auto;
  }
  .code .ln { display: block; padding: 1px 6px; border-radius: 4px; color: #8b93a7; }
  .code .ln.active { background: #3a5bbf; color: #fff; }
  .code .k { color: #c792ea; }
  .code .t { color: #82aaff; }
  .code .f { color: #82aaff; }
  .code .n { color: #f78c6c; }
  .code .c { color: #637777; font-style: italic; }
  .code .s { color: #c3e88d; }

  .stack-panel {
    background: #0c1120;
    border: 1px solid #232b48;
    border-radius: 10px;
    padding: 12px;
    min-height: 220px;
  }
  .stack-title { font-size: 12px; color: #8b93a7; margin-bottom: 8px; letter-spacing: .5px; }
  .frame {
    background: #1a2342;
    border: 1px solid #2e3a63;
    border-left: 3px solid #7fc7ff;
    border-radius: 6px;
    padding: 8px 10px;
    margin-bottom: 8px;
    font-size: 12px;
    font-family: "SF Mono", Menlo, monospace;
  }
  .frame .fv { color: #c3e88d; }
  .frame .fp { color: #ffc777; font-size: 11px; display: block; margin-top: 2px; }
  .frame.base { border-left-color: #ff9a8b; opacity: .85; }
  .stack-empty { font-size: 12px; color: #555c70; font-style: italic; }

  .narr {
    background: #1a2342;
    border: 1px solid #2e3a63;
    border-radius: 10px;
    padding: 14px 16px;
    font-size: 14px;
    line-height: 1.6;
    min-height: 64px;
    margin-bottom: 14px;
  }
  .narr .step-no { color: #7fc7ff; font-weight: 600; margin-right: 6px; }

  .controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  button {
    background: #232b48;
    color: #e6e9f0;
    border: 1px solid #2e3a63;
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
    transition: background .15s;
  }
  button:hover { background: #2e3a63; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.play { background: #3a5bbf; border-color: #4a6bcf; }
  .progress { font-size: 12px; color: #8b93a7; margin-left: auto; }
  .legend { display: flex; gap: 16px; font-size: 11px; color: #8b93a7; margin-top: 10px; flex-wrap: wrap; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .dot { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
</style>
</head>
<body>
<div class="wrap">
  <h1>两两交换链表中的节点（递归解法动画）</h1>
  <div class="sub">输入 1→2→3→4→∅，观察递归如何逐层改写指针，最终得到 2→1→4→3→∅</div>

  <div class="layout">
    <div>
      <div class="stage">
        <div class="canvas-wrap">
          <svg id="svg" viewBox="0 0 700 220" preserveAspectRatio="xMidYMid meet"></svg>
        </div>
      </div>

      <div class="narr"><span class="step-no" id="stepNo">步骤 0</span><span id="desc"></span></div>

      <div class="controls">
        <button id="prev">◀ 上一步</button>
        <button id="play" class="play">▶ 自动播放</button>
        <button id="next">下一步 ▶</button>
        <button id="reset">↺ 重置</button>
        <span class="progress" id="progress"></span>
      </div>
      <div class="legend">
        <span><span class="dot" style="background:#4a6bcf"></span>当前操作的节点</span>
        <span><span class="dot" style="background:#ff5c7c"></span>本步被改写的指针</span>
        <span><span class="dot" style="background:#555c70"></span>稳定指针</span>
      </div>
    </div>

    <div>
      <div class="stack-panel">
        <div class="stack-title">调用栈（栈顶在上）</div>
        <div id="stack"></div>
      </div>
      <div class="code" id="code"></div>
    </div>
  </div>
</div>

<script>
// 节点固定坐标
const NODES = {
  1: { x: 50,  y: 80 },
  2: { x: 200, y: 80 },
  3: { x: 350, y: 80 },
  4: { x: 500, y: 80 }
};
const NW = 70, NH = 50;          // 节点宽高
const NULL_X = 640, NULL_Y = 105; // ∅ 位置
const CY = 80 + NH / 2;          // 节点中心 y

// 每步状态
const steps = [
  { d:"初始链表：1→2→3→4→∅。开始调用 swapPairs(1)", line:-1,
    p:{1:2,2:3,3:4,4:null}, stack:[], active:[], changed:[] },
  { d:"进入第一层：head=1。head≠null 且 head.next=2≠null，不命中边界。执行 newHead = head.next = 2", line:4,
    p:{1:2,2:3,3:4,4:null}, stack:[{h:1,s:"newHead=2"}], active:[1,2], changed:[] },
  { d:"执行 head.next = swapPairs(newHead.next=3)，要先递归处理从 3 开始的子链", line:5,
    p:{1:2,2:3,3:4,4:null}, stack:[{h:1,s:"⏳ 递归中"},{h:3,s:"进入"}], active:[3,4], changed:[] },
  { d:"第二层：head=3，同样不命中边界。newHead₂ = head.next = 4", line:4,
    p:{1:2,2:3,3:4,4:null}, stack:[{h:1,s:"⏳ 递归中"},{h:3,s:"newHead=4"}], active:[3,4], changed:[] },
  { d:"第二层执行 head₂.next = swapPairs(newHead₂.next=null)，递归处理 null", line:5,
    p:{1:2,2:3,3:4,4:null}, stack:[{h:1,s:"⏳ 递归中"},{h:3,s:"⏳ 递归中"}], active:[3], changed:[] },
  { d:"swapPairs(null) 命中边界 head==null，返回 null（这一层什么都没改）", line:1,
    p:{1:2,2:3,3:4,4:null}, stack:[{h:1,s:"⏳ 递归中"},{h:3,s:"⏳ 递归中"},{h:"null",s:"边界返回 null",base:true}], active:[], changed:[] },
  { d:"回到第二层：head₂.next = 返回的 null，即 3.next 被改成 null（原指向 4）", line:5,
    p:{1:2,2:3,3:null,4:null}, stack:[{h:1,s:"⏳ 递归中"},{h:3,s:"head.next=null ✓"}], active:[3], changed:[3] },
  { d:"第二层：newHead₂.next = head₂，即 4.next 改成 3。子链重排为 4→3→∅", line:6,
    p:{1:2,2:3,3:null,4:3}, stack:[{h:1,s:"⏳ 递归中"},{h:3,s:"newHead.next=head ✓"}], active:[4], changed:[4] },
  { d:"第二层 return newHead₂=4：把以 4 开头的子链（4→3→∅）交回第一层，第二层出栈", line:7,
    p:{1:2,2:3,3:null,4:3}, stack:[{h:1,s:"收到返回值 4"}], active:[4], changed:[] },
  { d:"回到第一层：head.next = 返回的 4，即 1.next 改成 4（原指向 2）。现在 1→4→3→∅", line:5,
    p:{1:4,2:3,3:null,4:3}, stack:[{h:1,s:"head.next=4 ✓"}], active:[1], changed:[1] },
  { d:"第一层：newHead.next = head，即 2.next 改成 1（原指向 3）。现在 2→1→4→3→∅", line:6,
    p:{1:4,2:1,3:null,4:3}, stack:[{h:1,s:"newHead.next=head ✓"}], active:[2], changed:[2] },
  { d:"第一层 return newHead=2。最终结果：2→1→4→3→∅ ✅", line:7,
    p:{1:4,2:1,3:null,4:3}, stack:[], active:[2], changed:[] }
];

const codeLines = [
  ["c","// 递归解法"],
  ["k","class"],["t"," Solution {"],
  ["","  "],
  ["k","public "],["t","ListNode "],["f","swapPairs"],["","("],["t","ListNode "],["n","head"],[") {"],
  ["","    "],["k","if "],["","(head == "],["k","null"],[""," || head.next == "],["k","null"],["",") {"],
  ["","        "],["k","return "],["n","head"],["",";"],
  ["","    }"],
  ["","    "],["t","ListNode "],["n","newHead"],[""," = head.next;"],
  ["","    head.next = "],["f","swapPairs"],["","(newHead.next);"],
  ["","    newHead.next = head;"],
  ["","    "],["k","return "],["n","newHead"],["",";"],
  ["","  }"],
  ["","}"]
];
// 把上面的碎片按行分组，便于高亮整行
const codeByLine = [
  {i:0, parts:[["c","// 递归解法"]]},
  {i:-1,parts:[["","class Solution {"],["c"," // 仅为示意，提交时按题目模板"]]},
  {i:-1,parts:[["",""]]},
  {i:-1,parts:[["","public ListNode swapPairs(ListNode head) {"]]},
  {i:0, parts:[["","    if (head == null || head.next == null) {"]]},
  {i:1, parts:[["","        return head;"]]},
  {i:-1,parts:[["","    }"]]},
  {i:4, parts:[["","    ListNode newHead = head.next;"]]},
  {i:5, parts:[["","    head.next = swapPairs(newHead.next);"]]},
  {i:6, parts:[["","    newHead.next = head;"]]},
  {i:7, parts:[["","    return newHead;"]]},
  {i:-1,parts:[["","  }"]]},
  {i:-1,parts:[["","}"]]}
];

const svg = document.getElementById('svg');
const descEl = document.getElementById('desc');
const stepNoEl = document.getElementById('stepNo');
const stackEl = document.getElementById('stack');
const codeEl = document.getElementById('code');
const progressEl = document.getElementById('progress');

let idx = 0;
let timer = null;

function renderCode(activeLine){
  let html = '';
  codeByLine.forEach(L => {
    const cls = 'ln' + (L.i === activeLine ? ' active' : '');
    html += `<span class="${cls}">`;
    L.parts.forEach(p => {
      const k = p[0] ? ` ${p[0]}` : '';
      html += `<span class="${p[0]||''}">${escapeHtml(p[1])}</span>`;
    });
    html += '</span>\n';
  });
  codeEl.innerHTML = html;
}
function escapeHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function renderStack(stack){
  if(!stack.length){ stackEl.innerHTML = '<div class="stack-empty">（栈空，已全部返回）</div>'; return; }
  // 栈顶在上 → 倒序显示
  let html = '';
  for(let i=stack.length-1;i>=0;i--){
    const f = stack[i];
    const cls = 'frame' + (f.base?' base':'');
    html += `<div class="${cls}">swapPairs(head=<span class="fv">${f.h}</span>)<span class="fp">${f.s}</span></div>`;
  }
  stackEl.innerHTML = html;
}

function arrowPath(src, tgt){
  const s = NODES[src];
  const sx = s.x + NW;            // 源右沿
  const sy = CY;
  let tx, ty;
  if(tgt === null){ tx = NULL_X; ty = NULL_Y; }
  else { tx = NODES[tgt].x; ty = CY; }

  if(tgt === null){
    // 画到 ∅
    return { path:`M ${sx} ${sy} L ${tx-8} ${ty}`, arrowAtEnd:true };
  }
  if(tgt > src){
    // 向右：直线
    return { path:`M ${sx} ${sy} L ${tx-8} ${ty}`, arrowAtEnd:true };
  } else {
    // 向左：从源底部出发，向下绕到目标底部
    const midX = (sx + tx) / 2;
    const dip = 150;
    return { path:`M ${sx} ${s.y + NH} C ${sx} ${dip}, ${tx} ${dip}, ${tx} ${s.y + NH}`, arrowAtEnd:true, fromBottom:true };
  }
}

function render(idx){
  const st = steps[idx];
  descEl.textContent = st.d;
  stepNoEl.textContent = '步骤 ' + idx;
  progressEl.textContent = (idx+1) + ' / ' + steps.length;
  renderCode(st.line);
  renderStack(st.stack);

  // 画节点 + 指针
  let svgHtml = '';
  // defs: arrowhead
  svgHtml += `<defs>
    <marker id="ah-gray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555c70"/>
    </marker>
    <marker id="ah-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#ff5c7c"/>
    </marker>
    <marker id="ah-gray-null" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555c70"/>
    </marker>
  </defs>`;

  // 先画所有箭头（在节点下层）
  Object.keys(st.p).forEach(k => {
    const src = parseInt(k);
    const tgt = st.p[k];
    const a = arrowPath(src, tgt);
    const isChanged = st.changed.includes(src);
    const stroke = isChanged ? '#ff5c7c' : '#555c70';
    const marker = isChanged ? 'ah-red' : 'ah-gray';
    const w = isChanged ? 3.5 : 2;
    svgHtml += `<path d="${a.path}" stroke="${stroke}" stroke-width="${w}" fill="none" marker-end="url(#${marker})" ${isChanged?'class="pulse"':''}/>`;
  });

  // ∅ 标记
  svgHtml += `<text x="${NULL_X}" y="${NULL_Y+5}" fill="#555c70" font-size="18" text-anchor="middle">∅</text>`;

  // 画节点
  Object.keys(NODES).forEach(k => {
    const id = parseInt(k);
    const n = NODES[id];
    const isActive = st.active.includes(id);
    const fill = isActive ? '#4a6bcf' : '#232b48';
    const stroke = isActive ? '#7fc7ff' : '#2e3a63';
    svgHtml += `<rect x="${n.x}" y="${n.y}" width="${NW}" height="${NH}" rx="8" fill="${fill}" stroke="${stroke}" stroke-width="2"/>`;
    svgHtml += `<text x="${n.x + NW/2}" y="${n.y + NH/2 + 5}" fill="#e6e9f0" font-size="18" font-weight="600" text-anchor="middle">${id}</text>`;
    // next 槽标记
    svgHtml += `<circle cx="${n.x + NW - 6}" cy="${n.y + NH - 6}" r="3" fill="#7fc7ff" opacity="0.6"/>`;
  });

  svg.innerHTML = svgHtml;
}

function go(i){
  idx = Math.max(0, Math.min(steps.length-1, i));
  render(idx);
  document.getElementById('prev').disabled = idx === 0;
  document.getElementById('next').disabled = idx === steps.length-1;
}
function play(){
  if(timer){ stop(); return; }
  if(idx === steps.length-1) go(0);
  document.getElementById('play').textContent = '⏸ 暂停';
  timer = setInterval(()=>{
    if(idx < steps.length-1) go(idx+1);
    else stop();
  }, 2200);
}
function stop(){
  clearInterval(timer); timer = null;
  document.getElementById('play').textContent = '▶ 自动播放';
}

document.getElementById('prev').onclick = ()=>{ stop(); go(idx-1); };
document.getElementById('next').onclick = ()=>{ stop(); go(idx+1); };
document.getElementById('reset').onclick = ()=>{ stop(); go(0); };
document.getElementById('play').onclick = play;

// 键盘支持
document.addEventListener('keydown', e=>{
  if(e.key === 'ArrowLeft'){ stop(); go(idx-1); }
  else if(e.key === 'ArrowRight'){ stop(); go(idx+1); }
  else if(e.key === ' '){ e.preventDefault(); play(); }
});

go(0);
</script>
</body>
</html>
